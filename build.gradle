apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'application'

application {
	mainClass = 'de.avesbot.Avesbot'
}
ext {
	jdaVersion = '6.7.0'
	mariadbVersion = '4.0.0'
	commonsVersion = '1.15.0'
	jacksonVersion = '3.3.0'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation "net.dv8tion:JDA:$jdaVersion"
	implementation "org.mariadb.jdbc:mariadb-java-client:$mariadbVersion"
	implementation "org.apache.commons:commons-text:$commonsVersion"
	implementation "tools.jackson.core:jackson-databind:$jacksonVersion"
	implementation "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
	testImplementation 'junit:junit:4.13.2'
}

tasks.named('run') {
	if ( project.hasProperty("cmdArgs") ) {
		args Eval.me(cmdArgs)
	}
}